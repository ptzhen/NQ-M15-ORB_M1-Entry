# Single source of truth for every parameter in the project.
# Sections are added as each stage is built; nothing is hard-coded elsewhere.

seed: 20261006            # fixed seed for anything stochastic (bootstrap, Monte Carlo)

paths:
  raw_file: data/raw/glbx-mdp3-20100606-20261001.ohlcv-1m.dbn.zst
  # Verified on load so a silently different download can never produce different results.
  condition_file: data/raw/condition.json   # Databento's own per-day quality ledger
  raw_sha256: 779a2fb7815421da4adda936f0e62196dde3ce7c38c4fe3940c8a008099cd09f
  interim_dir: data/interim       # cache of the parsed NQ outrights (gitignored)
  processed_dir: data/processed   # cleaned bars + daily table (gitignored)
  output_dir: outputs             # generated reports and figures (gitignored)
  holdout_log: logs/holdout_access.log   # committed on purpose: an audit trail
  trials_log: logs/trials.jsonl          # every strategy variant evaluated (for multiple-testing correction)

data:
  product: NQ
  # Outright contracts only, e.g. NQH4. Calendar spreads (NQM0-NQU0) and other
  # products in the same file (MGC) are dropped. Quarterly months only for NQ.
  outright_regex: '^NQ[FGHJKMNQUVXZ]\d$'
  expected_month_codes: HMUZ
  tick_size: 0.25
  point_value_usd: {NQ: 20.0, MNQ: 2.0}

session:
  timezone: America/New_York
  cash_open: "09:30"
  cash_close: "16:00"
  flat_time: "15:55"        # every position is closed at the open of this bar
  range_minutes: 15         # opening range = first N one-minute bars
  calendar: XNYS            # source of truth for holidays and half-days

signal:
  # Breakout = a 1-minute bar CLOSES strictly beyond the opening range (a close equal to the
  # range edge is not a breakout). The first such bar after the range completes is the signal;
  # entry is at the NEXT bar's open. Only one signal per day.
  # The spec only says "flat by flat_time", so the default is the latest bar that still leaves
  # a bar before the exit: a signal whose entry bar would be at/after this is not traded.
  last_entry_bar: "15:54"

execution:
  # Primary specification = the strategy exactly as defined in the brief. Stage 6 varies these.
  stop_range_fraction: 1.0     # stop = range edge opposite the trade, i.e. 1.0 = full opposite side; 0.5 = midpoint
  target_r: 1.0                # target = entry +/- target_r * R (R = initial risk); null = no target
  # touch   : a limit target fills as soon as the bar's high/low reaches it (optimistic: no queue)
  # through : needs price to trade one tick BEYOND the target (a common proxy for queue position)
  target_fill: touch
  # If one 1-minute bar touches both stop and target we cannot know which came first.
  # stop_first is the conservative primary assumption; target_first is only used as an optimistic bound.
  ambiguity: stop_first
  min_risk_ticks: 1            # skip a trade whose risk (entry fill to stop) is below this
  costs:
    commission_per_side_usd: {NQ: 2.00, MNQ: 0.50}   # all-in estimate; replace with your broker's numbers
    # All-in adverse move per MARKET-type fill (entry, stop, time exit), in ticks. This folds in
    # crossing the bid/ask spread: there is no quote data, so spread cannot be modelled separately.
    slippage_ticks: 1.0
    limit_slippage_ticks: 0.0  # target exits are resting limit orders: no slippage assumed
    cost_scale: 1.0            # multiplies commission AND slippage (0 = frictionless, 2 = double costs)

contracts:
  # Trade the contract that led RTH volume on the PREVIOUS trading day (known
  # before the open, so no lookahead). A day is a roll day if that choice changed
  # or if the leader's share of RTH volume on the previous day was below this.
  roll_leader_min_share: 0.80

filters:
  # Which flagged days are removed from the tradable universe. Flags are always
  # computed and reported regardless of these switches.
  exclude_cash_closed: true      # NYSE closed but CME traded a short session
  exclude_early_close: true      # NYSE half-days (13:00 close)
  exclude_roll_days: true
  exclude_vendor_degraded: true  # days Databento itself marks 'degraded' in condition.json
  max_missing_range_bars: 0      # minutes with no trades allowed inside the opening range
  max_missing_window_bars: 0     # ... and in the rest of the window to flat_time

splits:
  # Develop and tune on dates <= dev_end only. The holdout is touched exactly once, at the end.
  dev_end: 2023-12-31
  holdout_start: 2024-01-01
